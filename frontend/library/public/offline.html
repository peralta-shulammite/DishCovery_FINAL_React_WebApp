<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2E7D32">
    <title>Offline - DishCovery</title>
    
    <!-- Add PWA meta tags with proper as attributes -->
    <link rel="manifest" href="/manifest.json" as="manifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DishCovery">
    
    <!-- Add icon references with proper as attributes -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/android/android-launchericon-192-192.png" as="image">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/android/android-launchericon-512-512.png" as="image">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/ios/180.png" as="image">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/ios/152.png" as="image">
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/ios/120.png" as="image">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/ios/32.png" as="image">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/ios/16.png" as="image">

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(135deg, #F9FAF9 0%, #E8F5E9 100%);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 20px;
        }

        .offline-container {
          text-align: center;
          max-width: 500px;
          background: white;
          padding: 40px 30px;
          border-radius: 20px;
          box-shadow: 0 8px 24px rgba(46, 125, 50, 0.15);
        }

        .offline-logo {
          width: 80px;
          height: 80px;
          margin: 0 auto 20px;
          background: #2E7D32;
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-size: 36px;
          font-weight: 700;
          box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .offline-icon {
          width: 100px;
          height: 100px;
          margin: 0 auto 20px;
          opacity: 0.7;
        }

        .offline-icon svg {
          width: 100%;
          height: 100%;
          fill: #2E7D32;
        }

        h1 {
          font-size: 28px;
          color: #2E7D32;
          margin-bottom: 12px;
          font-weight: 700;
        }

        p {
          font-size: 16px;
          color: #424242;
          line-height: 1.6;
          margin-bottom: 24px;
        }

        .retry-btn {
          background: linear-gradient(135deg, #2E7D32 0%, #4CAF50 100%);
          color: white;
          border: none;
          border-radius: 12px;
          padding: 14px 32px;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.3s ease;
          box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .retry-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
        }

        .retry-btn:active {
          transform: translateY(0);
        }

        .offline-tips {
          margin-top: 30px;
          padding-top: 30px;
          border-top: 1px solid #E0E0E0;
          text-align: left;
        }

        .offline-tips h3 {
          font-size: 16px;
          color: #2E7D32;
          margin-bottom: 12px;
          font-weight: 600;
        }

        .offline-tips ul {
          list-style: none;
          padding: 0;
        }

        .offline-tips li {
          font-size: 14px;
          color: #616161;
          margin-bottom: 8px;
          padding-left: 20px;
          position: relative;
        }

        .offline-tips li:before {
          content: "✓";
          position: absolute;
          left: 0;
          color: #2E7D32;
          font-weight: bold;
        }

        @media (max-width: 480px) {
          .offline-container {
            padding: 30px 20px;
          }

          h1 {
            font-size: 24px;
          }

          p {
            font-size: 14px;
          }

          .offline-logo {
            width: 60px;
            height: 60px;
            font-size: 28px;
          }

          .retry-btn {
            padding: 12px 24px;
            font-size: 14px;
          }
        }
      </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-logo">DC</div>

        <div class="offline-icon">
          <svg viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46C10.21 6.23 11.08 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3 0 1.13-.64 2.11-1.56 2.62l1.45 1.45C23.16 18.16 24 16.68 24 15c0-2.64-2.05-4.78-4.65-4.96zM3 5.27l2.75 2.74C2.56 8.15 0 10.77 0 14c0 3.31 2.69 6 6 6h11.73l2 2L21 20.73 4.27 4 3 5.27zM7.73 10l8 8H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h1.73z"/>
          </svg>
        </div>

        <h1>You're Offline</h1>
        <p>No internet connection detected. Please check your connection and try again.</p>

        <button class="retry-btn" onclick="window.location.reload()">
          Try Again
        </button>

        <div class="offline-tips">
          <h3>While you're offline:</h3>
          <ul>
            <li>Check your Wi-Fi or mobile data connection</li>
            <li>Make sure airplane mode is off</li>
            <li>Try moving to a location with better signal</li>
          </ul>
        </div>
      </div>

      <script>
        // Enhanced offline detection and retry
        window.addEventListener('online', function() {
            // Check if the main page is available before reloading
            fetch(window.location.origin)
                .then(response => {
                    if (response.ok) {
                        window.location.reload();
                    }
                })
                .catch(error => {
                    console.log('Connection restored but server not reachable:', error);
                });
        });

        // Add service worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
